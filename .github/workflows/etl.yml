name: Daily POD Keyword ETL

on:
  schedule:
    # Her gece TSİ 04:00 (UTC 01:00)
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        env:
          GELATO_API_KEY: ${{ secrets.GELATO_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          EBAY_ACCESS_TOKEN: ${{ secrets.EBAY_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py

      - name: Upload CSV artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: etl-outputs
          path: output/*.csv
